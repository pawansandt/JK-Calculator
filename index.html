<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK Calculator</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <style>
        body { font-family: sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f4f4f4; }
        input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { margin-top: 20px; padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <h1>JK Calculator</h1>
    <table id="calcTable">
        <thead>
            <tr>
                <th>Amount</th>
                <th>Percentage (%)</th>
                <th>Result</th>
                <th>Amount - Result</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="number" class="amount" placeholder="e.g. 100" oninput="calculate(this)"></td>
                <td><input type="number" class="percentage" placeholder="e.g. 10" oninput="calculate(this)"></td>
                <td class="result">0.00</td>
                <td class="diff">0.00</td>
            </tr>
            <tr>
                <td><input type="number" class="amount" placeholder="e.g. 250" oninput="calculate(this)"></td>
                <td><input type="number" class="percentage" placeholder="e.g. 20" oninput="calculate(this)"></td>
                <td class="result">0.00</td>
                <td class="diff">0.00</td>
            </tr>
        </tbody>
    </table>
    <button onclick="addRow()">Add Row</button>

    <script>
        function calculate(element) {
            const row = element.parentElement.parentElement;
            const amount = parseFloat(row.querySelector('.amount').value) || 0;
            const percentage = parseFloat(row.querySelector('.percentage').value) || 0;
            const result = (amount * percentage) / 100;
            const diff = amount - result;
            row.querySelector('.result').innerText = result.toFixed(2);
            row.querySelector('.diff').innerText = diff.toFixed(2);
        }

        function addRow() {
            const table = document.getElementById('calcTable').getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();
            newRow.innerHTML = `
                <td><input type="number" class="amount" placeholder="e.g. 100" oninput="calculate(this)"></td>
                <td><input type="number" class="percentage" placeholder="e.g. 10" oninput="calculate(this)"></td>
                <td class="result">0.00</td>
                <td class="diff">0.00</td>
            `;
        }

        // Register Service Worker for PWA support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('Service Worker registered!', reg))
                    .catch((err) => console.log('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
